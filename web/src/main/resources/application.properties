spring.application.name=web

# ---- Web 服务 ----
server.port=9090

# ---- MySQL 数据源 ----
spring.datasource.url=jdbc:mysql://localhost:3306/web?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=20051001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- MyBatis ----
# 下划线列名自动映射为驼峰属性
mybatis.configuration.map-underscore-to-camel-case=true
# SQL 日志输出到控制台，便于调试
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Mapper XML 位置与实体类别名包
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.web.pojo
